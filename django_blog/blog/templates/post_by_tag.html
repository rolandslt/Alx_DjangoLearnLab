{% extends 'base.html' %}
{% block content %}
<h1>Posts with tag: {{ view.kwargs.tag_slug }}</h1>
{% for post in posts %}
  <h2><a href="{% url 'post-detail' post.pk %}">{{ post.title }}</a></h2>
  <p>{{ post.content|truncatewords:30 }}</p>
{% empty %}
  <p>No posts found for this tag.</p>
{% endfor %}
{% endblock %}
