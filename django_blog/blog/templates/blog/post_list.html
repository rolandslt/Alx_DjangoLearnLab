{% extends 'base.html' %}
{% block content %}
<h1>Blog Posts</h1>
<ul>
  {% for post in posts %}
    <li>
      <a href="{% url 'post-detail' post.pk %}">{{ post.title }}</a> by {{ post.author }}
    </li>
  {% empty %}
    <li>No posts yet.</li>
  {% endfor %}
</ul>
<a href="{% url 'post-create' %}">Create New Post</a>
{% endblock %}
